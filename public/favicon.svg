<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Sugarloop">
  <!--
    A donut, not the wordmark. The logo is 432x288 of script lettering with thin
    drip strokes; at the 16px a browser tab actually renders, it collapses into a
    smudge. A filled shape in the brand blue and pink stays legible at that size
    and still reads as this shop.
  -->
  <rect width="32" height="32" rx="7" fill="#325F8A"/>
  <circle cx="16" cy="16" r="9.5" fill="#F7B5D1"/>
  <circle cx="16" cy="16" r="3.4" fill="#325F8A"/>
  <g fill="#D55193">
    <circle cx="16" cy="9.3" r="1.15"/>
    <circle cx="20.8" cy="11.6" r="1.15"/>
    <circle cx="21.9" cy="17.4" r="1.15"/>
    <circle cx="17.6" cy="21.9" r="1.15"/>
    <circle cx="11.6" cy="20.2" r="1.15"/>
    <circle cx="10.6" cy="13.6" r="1.15"/>
  </g>
</svg>
